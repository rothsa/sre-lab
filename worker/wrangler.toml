name = "down-or-me"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# No public URL: the cron job only writes to D1. The board's API lives in Pages Functions.
workers_dev = false

[[d1_databases]]
binding = "DB"
database_name = "down-or-me"
database_id = "f746c8d5-340e-42e5-ad68-ce312cd8def8"
migrations_dir = "migrations"

[vars]
JEV_MODEL = "jev-latest"
JEV_DAILY_CAP = "200"
NOTIFY_FROM = "status@sallyroth.dev"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   JEV_API_KEY              Jev / TypeSafe API key
#   RESEND_API_KEY           Resend API key for alert email
#   NOTIFY_TO                where alerts go
#   PRIVATE_TARGETS          JSON array of the owner's private checks (kept out of this repo)
#   BLIZZARD_CLIENT_ID       optional, for the WoW realm check
#   BLIZZARD_CLIENT_SECRET   optional
